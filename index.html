  body {
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 28px 20px 40px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    padding: 12px 12px 22px;
    background: var(--card);
    border-radius: 44px;
    box-shadow: 0 0 0 1px var(--card-edge), inset 0 1px 0 rgba(255,255,255,.12), 0 40px 80px -30px rgba(0,0,0,.65);
    animation: rise .8s cubic-bezier(.2,.7,.2,1) both;
  }
  .photo {
    position: relative;
    aspect-ratio: 720 / 828;
    border-radius: 34px;
    overflow: hidden;
    background: #5a2a18;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fade { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none; }
  .blur-a {
    height: 44%;
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 45%);
    mask-image: linear-gradient(to bottom, transparent, #000 45%);
  }
  .blur-b {
    height: 28%;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 65%);
    mask-image: linear-gradient(to bottom, transparent, #000 65%);
  }
  .tint {
    height: 44%;
    background: linear-gradient(to bottom, rgba(18,18,20,0), rgba(18,18,20,.78));
  }
  .caption {
    position: absolute; left: 24px; right: 24px; bottom: 22px;
    text-align: left;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.9rem, 8.4vw, 2.2rem);
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.08;
  }
  .role { margin: 8px 0 0; font-size: 1.0625rem; letter-spacing: -0.01em; color: var(--ink-2); line-height: 1.3; }
  .company { margin: 2px 0 0; font-size: 1.0625rem; letter-spacing: -0.01em; color: var(--muted); line-height: 1.3; }
  .actions { margin: 14px 12px 0; display: grid; gap: 10px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    min-height: 54px;
    padding: 0 22px;
    border-radius: 999px;
    font-size: 1.0625rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    text-decoration: none;
    transition: opacity .2s ease, transform .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
  .btn:hover { opacity: .9; }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .btn-primary { background: var(--pill); color: var(--pill-ink); box-shadow: 0 8px 24px -10px rgba(255,255,255,.35); }
  .btn-secondary { background: var(--pill-2); color: var(--pill-2-ink); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
    .card {
      background: rgba(10,18,22,.42);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      backdrop-filter: blur(28px) saturate(1.4);
    }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .btn { transition: none; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
